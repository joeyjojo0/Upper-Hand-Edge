name: UHE data engine
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force refresh (all, or comma list: markets,scan-hist,flow,calendar)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: uhe-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch previous snapshots
        run: |
          git fetch origin data:data 2>/dev/null && git worktree add out data || (git worktree add --orphan -b data out 2>/dev/null || (mkdir -p out && cd out && git init -b data))
      - name: Build data
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/build-data.mjs out
      - name: Publish to data branch
        run: |
          cd out
          git config user.name "uhe-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data $(date -u +%FT%TZ)" --quiet || exit 0
          # keep the branch small: squash history to one commit
          git reset --soft $(git commit-tree HEAD^{tree} -m "data $(date -u +%FT%TZ)")
          git push -f origin HEAD:data
